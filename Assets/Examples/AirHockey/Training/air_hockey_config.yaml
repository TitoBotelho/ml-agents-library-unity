# PPO config para o AirHockey (ML-Agents 0.30.0 / pacote 2.0.1)
# Observação: garanta que os dois agentes compartilhem o mesmo Behavior Name em Unity
# para treinarem com a mesma política (ex.: "AirHockey").

behaviors:
  AirHockey:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 5000
    threaded: true

